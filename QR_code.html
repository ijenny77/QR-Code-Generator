<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="post">
        <div class="generator">
            <h1 id="heading">QR Code Generator</h1>
            <input type="text" name="url-input" id="input" placeholder="Enter text or URL"><br>
            <button id="button">Generate QR</button><br>
            <div class="image">
                <img src="qr_img.png" id="image" alt="image of the url">
            </div>
            <a href="#" id="download">Download QR</a>
        </div>
    </form>
</body>
</html>
